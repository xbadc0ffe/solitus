<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Solitus task details</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
a{color:#FFFFFF}a:hover{color:#FFFFFF}
button{cursor:pointer}
</style>
</helmet>
<div onMouseMove="{{move}}" style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background: #08090B; color: #FFFFFF; font-family: Inter, system-ui, sans-serif; overflow: hidden">

<div aria-hidden="true" style="position: absolute; left: -160px; top: -140px; width: 520px; height: 520px; background: radial-gradient(circle, rgba(140,158,190,0.30) 0%, rgba(140,158,190,0) 66%)"></div>
<div aria-hidden="true" style="position: absolute; left: 120px; top: 300px; width: 460px; height: 460px; background: radial-gradient(circle, rgba(150,152,172,0.16) 0%, rgba(150,152,172,0) 66%)"></div>
<div aria-hidden="true" style="position: absolute; left: -180px; top: 560px; width: 480px; height: 480px; background: radial-gradient(circle, rgba(112,132,162,0.20) 0%, rgba(112,132,162,0) 66%)"></div>
<div aria-hidden="true" style="position: absolute; left: -80px; top: 190px; width: 620px; height: 46px; transform: rotate(-24deg); background: linear-gradient(180deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.07) 50%, rgba(255,255,255,0) 100%)"></div>
<div aria-hidden="true" style="position: absolute; left: -120px; top: 520px; width: 680px; height: 70px; transform: rotate(-24deg); background: linear-gradient(180deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.05) 50%, rgba(255,255,255,0) 100%)"></div>

<div style="position: relative; display: flex; flex-direction: column; gap: 15px; padding: 10px 16px 0; perspective: 900px">

<div style="display: flex; align-items: center; justify-content: space-between; height: 44px">
<a href="Main.dc.html" style="display: flex; align-items: center; gap: 4px; height: 44px; font-size: 15px; font-weight: 600; text-decoration: none"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>Track</a>
<a href="EditTask.dc.html" style="display: flex; align-items: center; height: 44px; padding: 0 4px; font-size: 15px; font-weight: 600; text-decoration: none">Edit</a>
</div>

<section style="position: relative; height: 112px; box-sizing: border-box; overflow: hidden; border-radius: 20px; transform: {{tilt}}; background: {{glass}}; -webkit-backdrop-filter: blur(18px) saturate(130%); backdrop-filter: blur(18px) saturate(130%); border: 1px solid rgba(255,255,255,0.12); box-shadow: {{slab}}">
<span aria-hidden="true" style="position: absolute; left: 0; top: 0; bottom: 0; width: 33.33%; background: {{lit}}; border-right: 1px solid rgba(255,255,255,0.16)"></span>
<span aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 0; bottom: 0; background: {{seams}}"></span>
<span aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 0; bottom: 0; background: {{shine}}"></span>
<div style="position: absolute; left: 16px; right: 16px; top: 13px; display: flex; align-items: baseline; justify-content: space-between">
<h1 style="margin: 0; font-size: 24px; font-weight: 600; letter-spacing: -0.02em">Medication</h1>
<span style="font-size: 13px; font-weight: 500; color: rgba(255,255,255,0.74)">Daily</span>
</div>
<div style="position: absolute; left: 16px; right: 16px; bottom: 12px; display: flex; align-items: baseline; gap: 6px">
<span style="font-size: 24px; font-weight: 600; letter-spacing: -0.02em">1/3</span>
<span style="font-size: 13px; font-weight: 500; color: rgba(255,255,255,0.74)">today</span>
</div>
</section>

<sc-for list="{{averages}}" as="v" hint-placeholder-count="2">
<section style="position: relative; height: 58px; box-sizing: border-box; overflow: hidden; border-radius: 18px; transform: {{tilt}}; background: {{glass}}; -webkit-backdrop-filter: blur(18px) saturate(130%); backdrop-filter: blur(18px) saturate(130%); border: 1px solid rgba(255,255,255,0.12); box-shadow: {{slab}}">
<span aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 0; bottom: 0; background: {{v.fill}}"></span>
<span aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 0; bottom: 0; background: {{shine}}"></span>
<div style="position: absolute; left: 16px; right: 16px; top: 0; bottom: 0; display: flex; align-items: center; justify-content: space-between">
<h2 style="margin: 0; font-size: 14px; font-weight: 500">{{v.label}}</h2>
<span style="font-size: 24px; font-weight: 600; letter-spacing: -0.02em">{{v.text}}</span>
</div>
</section>
</sc-for>

<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px">
<sc-for list="{{streaks}}" as="s" hint-placeholder-count="3">
<div style="position: relative; display: flex; flex-direction: column; justify-content: center; gap: 1px; height: 72px; padding: 0 14px; box-sizing: border-box; overflow: hidden; border-radius: 18px; transform: {{tilt}}; background: {{glass}}; -webkit-backdrop-filter: blur(18px) saturate(130%); backdrop-filter: blur(18px) saturate(130%); border: 1px solid rgba(255,255,255,0.12); box-shadow: {{slab}}">
<span aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 0; bottom: 0; background: {{shine}}"></span>
<span style="position: relative; font-size: 26px; font-weight: 600; letter-spacing: -0.02em; line-height: 30px">{{s.value}}</span>
<span style="position: relative; font-size: 12px; font-weight: 500; color: rgba(255,255,255,0.74)">{{s.label}}</span>
</div>
</sc-for>
</div>

<section style="position: relative; display: flex; flex-direction: column; gap: 8px; padding: 6px 14px 14px; overflow: hidden; border-radius: 20px; transform: {{tilt}}; background: {{glass}}; -webkit-backdrop-filter: blur(18px) saturate(130%); backdrop-filter: blur(18px) saturate(130%); border: 1px solid rgba(255,255,255,0.12); box-shadow: {{slab}}">
<span aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 0; bottom: 0; background: {{shine}}"></span>
<div style="position: relative; display: flex; align-items: center; justify-content: space-between; height: 44px">
<button type="button" aria-label="Previous" style="display: flex; align-items: center; justify-content: flex-start; width: 44px; height: 44px; border: 0; background: transparent; color: #FFFFFF"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
<button type="button" onClick="{{toggleView}}" style="display: flex; align-items: center; gap: 6px; height: 44px; padding: 0 12px; border: 0; background: transparent; color: #FFFFFF; font: inherit; font-size: 15px; font-weight: 600">{{calTitle}}<svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
<button type="button" aria-label="Next" style="display: flex; align-items: center; justify-content: flex-end; width: 44px; height: 44px; border: 0; background: transparent; color: rgba(255,255,255,0.74)"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
</div>
<sc-if value="{{isMonth}}" hint-placeholder-val="{{true}}">
<div style="position: relative; display: flex; flex-direction: column; gap: 8px">
<div aria-hidden="true" style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 7px; text-align: center; font-size: 11px; font-weight: 500; color: rgba(255,255,255,0.74)">
<span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span>
</div>
<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 7px">
<sc-for list="{{cells}}" as="c" hint-placeholder-count="30">
<div style="display: flex; align-items: center; justify-content: center; aspect-ratio: 1 / 1; box-sizing: border-box; border-radius: 7px; font-size: 13px; font-weight: 600; background: {{c.bg}}; color: {{c.fg}}; border: {{c.border}}; box-shadow: {{c.glow}}">{{c.day}}</div>
</sc-for>
</div>
</div>
</sc-if>
<sc-if value="{{isYear}}" hint-placeholder-val="{{false}}">
<div style="position: relative; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{months}}" as="mo" hint-placeholder-count="12">
<button type="button" onClick="{{toggleView}}" style="display: flex; flex-direction: column; gap: 2px; height: 80px; padding: 6px; box-sizing: border-box; border-radius: 12px; border: {{mo.border}}; background: rgba(0,0,0,0.30); box-shadow: inset 0 1px 3px rgba(0,0,0,0.60), inset 0 -1px 0 rgba(255,255,255,0.08); color: {{mo.fg}}; font: inherit; font-size: 11px; font-weight: 600; text-align: left">{{mo.name}}<span aria-hidden="true" style="display: block; flex-grow: 1; align-self: stretch; background: {{mo.bloom}}"></span></button>
</sc-for>
</div>
</sc-if>
</section>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"effects":{"editor":"boolean","default":true},"glassTint":{"editor":"color","default":"#DCE6F5","options":["#DCE6F5","#FFFFFF","#BFE6DA","#F2D3AE"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = {};
}
renderVals() {
var self = this;
var fx = this.props.effects ?? true;
var st = this.state || {};
var tx = st.tx == null ? -0.35 : st.tx;
var ty = st.ty == null ? -0.4 : st.ty;
if (!fx) { tx = 0; ty = 0; }
var hex = String(this.props.glassTint ?? '#DCE6F5').replace('#', '');
if (hex.length === 3) { hex = hex[0] + hex[0] + hex[1] + hex[1] + hex[2] + hex[2]; }
var n = parseInt(hex, 16);
if (isNaN(n)) { n = 0xDCE6F5; }
var t = ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255);
var glass = 'linear-gradient(160deg, rgba(' + t + ',0.11) 0%, rgba(' + t + ',0.03) 100%)';
var lit = 'linear-gradient(180deg, rgba(' + t + ',0.24) 0%, rgba(' + t + ',0.11) 100%)';
var slab = fx
? 'inset 1px 1px 0 rgba(255,255,255,0.42), inset -1px -1px 0 rgba(0,0,0,0.40), inset 0 0 22px rgba(255,255,255,0.05), 0 1px 0 rgba(196,210,232,0.34), 0 2px 0 rgba(156,170,194,0.28), 0 3px 0 rgba(116,130,154,0.24), 0 4px 0 rgba(76,88,108,0.24), 0 5px 0 rgba(30,36,48,0.40), ' + (-tx * 4).toFixed(1) + 'px ' + (18 - ty * 3).toFixed(1) + 'px 26px -6px rgba(0,0,0,0.88)'
: 'inset 0 1px 0 rgba(255,255,255,0.18), 0 10px 18px -12px rgba(0,0,0,0.75)';
var tilt = fx ? 'rotateX(' + (-ty * 1.3).toFixed(2) + 'deg) rotateY(' + (tx * 1.3).toFixed(2) + 'deg)' : 'none';
var shine = fx
? 'radial-gradient(130px 84px at ' + (12 + tx * 10).toFixed(1) + '% ' + (2 + ty * 8).toFixed(1) + '%, rgba(255,255,255,0.26) 0%, rgba(255,255,255,0) 72%), linear-gradient(125deg, rgba(255,255,255,0.10) 0%, rgba(255,255,255,0) 30%)'
: 'linear-gradient(180deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0) 50%)';
var W = 356;
var seamList = [];
for (var i = 1; i < 3; i++) {
seamList.push('linear-gradient(90deg, rgba(255,255,255,0) 0px, rgba(255,255,255,0.10) 5px, rgba(0,0,0,0.50) 5px, rgba(0,0,0,0.50) 6px, rgba(255,255,255,0.36) 6px, rgba(255,255,255,0.36) 7px, rgba(255,255,255,0.06) 7px, rgba(255,255,255,0) 12px) ' + (W * i / 3 - 6).toFixed(1) + 'px 0px / 12px 100% no-repeat');
}
var stops = [[12,12,14],[44,22,6],[96,44,8],[150,70,8],[232,120,16],[255,164,44]];
function ramp(k) {
var x = Math.max(0, Math.min(1, k)) * 5;
var j = Math.min(4, Math.floor(x));
var f = x - j;
var a = stops[j], b = stops[j + 1];
return Math.round(a[0] + (b[0] - a[0]) * f) + ',' + Math.round(a[1] + (b[1] - a[1]) * f) + ',' + Math.round(a[2] + (b[2] - a[2]) * f);
}
var averages = [{ label: 'Last 30 days', p: 82 }, { label: 'Last 90 days', p: 78 }].map(function (v) {
var c = ramp(v.p / 85);
return {
label: v.label, text: v.p + '%',
fill: 'linear-gradient(90deg, rgba(' + c + ',0.06) 0%, rgba(' + c + ',0.50) ' + (v.p - 12) + '%, rgba(' + c + ',0) ' + (v.p + 3) + '%)'
};
});
var streaks = [{ value: '6', label: 'Current' }, { value: '9', label: 'Average' }, { value: '31', label: 'Best' }];
var vals = [3,3,2,3,0,3,3,3,1,3,3,3,2,0,3,3,3,3,3,1];
var cells = [];
var novK = [];
var m = 0.7;
var cx = (34 + tx * 12).toFixed(0), cy = (30 + ty * 12).toFixed(0);
for (var d = 1; d <= 30; d++) {
if (d > vals.length) {
cells.push({ day: d, bg: 'transparent', fg: 'rgba(255,255,255,0.62)', border: '1px solid rgba(255,255,255,0.10)', glow: 'none' });
continue;
}
var a = vals[d - 1] / 3;
m = 0.55 * m + 0.45 * a;
var kk = 0.6 * a + 0.4 * m;
novK.push(kk);
var step = Math.round(kk * 5);
var s = stops[step];
var rgb = s[0] + ',' + s[1] + ',' + s[2];
var hi = Math.min(255, Math.round(s[0] * 1.12 + 6)) + ',' + Math.min(255, Math.round(s[1] * 1.15 + 6)) + ',' + Math.min(255, Math.round(s[2] * 1.2 + 6));
var today = d === vals.length;
var halo = step >= 2 ? ', 0 0 ' + (2 + 4 * step) + 'px rgba(' + rgb + ',' + (0.20 + 0.12 * step).toFixed(2) + ')' : '';
cells.push({
day: d,
bg: fx
? 'linear-gradient(135deg, rgba(255,255,255,0.30) 0%, rgba(255,255,255,0) 38%, rgba(0,0,0,0) 62%, rgba(0,0,0,0.30) 100%), radial-gradient(circle at ' + cx + '% ' + cy + '%, rgb(' + hi + ') 0%, rgb(' + rgb + ') 78%)'
: 'rgb(' + rgb + ')',
fg: step >= 4 ? '#1A0E05' : '#F2F3F5',
border: today ? '2px solid #FFFFFF' : '1px solid rgba(255,255,255,0.10)',
glow: (fx ? 'inset 1px 1px 0 rgba(255,255,255,0.38), inset -1px -1px 0 rgba(0,0,0,0.50), 0 2px 0 rgba(0,0,0,0.55)' : 'inset 0 1px 0 rgba(255,255,255,0.12)') + halo
});
}
var mNames = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var mDays = [31,28,31,30,31,30,31,31,30,31,30,31];
var mDow = [4,0,0,3,5,1,3,6,2,4,0,2];
var levels = [0.45,0.50,0.62,0.55,0.70,0.80,0.62,0.48,0.72,0.82];
var seed = 20261120;
function rnd() { seed = (seed * 1664525 + 1013904223) % 4294967296; return seed / 4294967296; }
var months = [];
var mm = 0.6;
for (var mi = 0; mi < 12; mi++) {
var layers = [];
for (var dd = 1; dd <= mDays[mi]; dd++) {
var k2;
if (mi === 11) { break; }
if (mi === 10) {
if (dd > novK.length) { break; }
k2 = novK[dd - 1];
} else {
var aa = Math.max(0, Math.min(1, levels[mi] + (rnd() - 0.5) * 0.9));
mm = 0.55 * mm + 0.45 * aa;
k2 = 0.6 * aa + 0.4 * mm;
}
if (k2 < 0.12) { continue; }
var pos = mDow[mi] + dd - 1;
var col = ramp(k2);
layers.push('radial-gradient(circle 8px at ' + (((pos % 7) + 0.5) / 7 * 100).toFixed(1) + '% ' + ((Math.floor(pos / 7) + 0.5) / 6 * 100).toFixed(1) + '%, rgba(' + col + ',' + (0.25 + 0.75 * k2).toFixed(2) + ') 0%, rgba(' + col + ',0) 100%)');
}
months.push({
name: mNames[mi],
bloom: layers.length ? layers.join(', ') : 'none',
border: mi === 10 ? '1px solid rgba(255,255,255,0.70)' : '1px solid rgba(255,255,255,0.08)',
fg: mi > 10 ? 'rgba(255,255,255,0.62)' : '#FFFFFF'
});
}
var yearView = st.view === 'year';
return {
months: months, isMonth: !yearView, isYear: yearView, calTitle: yearView ? '2026' : 'November 2026',
toggleView: function () { self.setState({ view: yearView ? 'month' : 'year' }); },
glass: glass, lit: lit, slab: slab, tilt: tilt, shine: shine, seams: seamList.join(', '),
averages: averages, streaks: streaks, cells: cells,
move: function (e) {
var now = Date.now();
if (self._last && now - self._last < 40) { return; }
self._last = now;
var r = e.currentTarget.getBoundingClientRect();
self.setState({ tx: ((e.clientX - r.left) / r.width) * 2 - 1, ty: ((e.clientY - r.top) / r.height) * 2 - 1 });
}
};
}
}
</script>
</body>
</html>
