<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Solitus edit task</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
a{color:#FFFFFF}a:hover{color:#FFFFFF}
button{cursor:pointer}
input::placeholder{color:rgba(255,255,255,0.62)}
</style>
</helmet>
<div onMouseMove="{{move}}" style="position: relative; width: 390px; height: 1190px; box-sizing: border-box; background: #08090B; color: #FFFFFF; font-family: Inter, system-ui, sans-serif; overflow: hidden">

<div aria-hidden="true" style="position: absolute; left: -160px; top: -140px; width: 520px; height: 520px; background: radial-gradient(circle, rgba(140,158,190,0.30) 0%, rgba(140,158,190,0) 66%)"></div>
<div aria-hidden="true" style="position: absolute; left: 120px; top: 420px; width: 460px; height: 460px; background: radial-gradient(circle, rgba(150,152,172,0.16) 0%, rgba(150,152,172,0) 66%)"></div>
<div aria-hidden="true" style="position: absolute; left: -180px; top: 800px; width: 480px; height: 480px; background: radial-gradient(circle, rgba(112,132,162,0.20) 0%, rgba(112,132,162,0) 66%)"></div>
<div aria-hidden="true" style="position: absolute; left: -80px; top: 190px; width: 620px; height: 46px; transform: rotate(-24deg); background: linear-gradient(180deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.07) 50%, rgba(255,255,255,0) 100%)"></div>
<div aria-hidden="true" style="position: absolute; left: -120px; top: 760px; width: 680px; height: 70px; transform: rotate(-24deg); background: linear-gradient(180deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.05) 50%, rgba(255,255,255,0) 100%)"></div>

<div style="position: relative; display: flex; flex-direction: column; gap: 15px; padding: 10px 16px 0; perspective: 900px">

<div style="display: flex; align-items: center; justify-content: space-between; height: 44px">
<a href="Detail.dc.html" style="display: flex; align-items: center; height: 44px; font-size: 15px; font-weight: 500; text-decoration: none">Cancel</a>
<h1 style="margin: 0; font-size: 16px; font-weight: 600">Edit task</h1>
<a href="Detail.dc.html" style="display: flex; align-items: center; height: 44px; font-size: 15px; font-weight: 700; text-decoration: none">Save</a>
</div>

<section style="position: relative; display: flex; align-items: flex-end; gap: 12px; padding: 14px 16px 16px; overflow: hidden; border-radius: 20px; transform: {{tilt}}; background: {{glass}}; -webkit-backdrop-filter: blur(18px) saturate(130%); backdrop-filter: blur(18px) saturate(130%); border: 1px solid rgba(255,255,255,0.12); box-shadow: {{slab}}">
<span aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 0; bottom: 0; background: {{shine}}"></span>
<button type="button" aria-label="Choose icon" style="position: relative; display: flex; align-items: center; justify-content: center; flex-shrink: 0; width: 48px; height: 48px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.14); background: rgba(0,0,0,0.30); box-shadow: inset 0 1px 3px rgba(0,0,0,0.60), inset 0 -1px 0 rgba(255,255,255,0.08); color: #FFFFFF"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9h12a3 3 0 0 1 0 6H6a3 3 0 0 1 0-6zM12 9v6"/></svg></button>
<div style="position: relative; flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px">
<label for="task-name" style="font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.74)">Name</label>
<input id="task-name" type="text" value="{{name}}" onChange="{{setName}}" placeholder="Task name" style="width: 100%; height: 48px; box-sizing: border-box; padding: 0 14px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.14); background: rgba(0,0,0,0.30); box-shadow: inset 0 1px 3px rgba(0,0,0,0.60), inset 0 -1px 0 rgba(255,255,255,0.08); color: #FFFFFF; font: inherit; font-size: 17px; font-weight: 600">
</div>
</section>

<section style="position: relative; display: flex; flex-direction: column; gap: 10px; padding: 14px 16px 16px; overflow: hidden; border-radius: 20px; transform: {{tilt}}; background: {{glass}}; -webkit-backdrop-filter: blur(18px) saturate(130%); backdrop-filter: blur(18px) saturate(130%); border: 1px solid rgba(255,255,255,0.12); box-shadow: {{slab}}">
<span aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 0; bottom: 0; background: {{shine}}"></span>
<h2 style="position: relative; margin: 0; font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.74)">Type</h2>
<div role="group" aria-label="Type" style="position: relative; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); padding: 3px; border-radius: 14px; background: rgba(0,0,0,0.30); box-shadow: inset 0 1px 3px rgba(0,0,0,0.60), inset 0 -1px 0 rgba(255,255,255,0.08)">
<sc-for list="{{typeSeg}}" as="o" hint-placeholder-count="2">
<button type="button" onClick="{{o.pick}}" aria-pressed="{{o.on}}" style="height: 38px; border: 0; border-radius: 11px; font: inherit; font-size: 13px; font-weight: 600; background: {{o.bg}}; color: {{o.fg}}; box-shadow: {{o.sh}}">{{o.label}}</button>
</sc-for>
</div>
<p style="position: relative; margin: 0; font-size: 12px; line-height: 16px; color: rgba(255,255,255,0.74)">{{typeHelp}}</p>
</section>

<section style="position: relative; display: flex; flex-direction: column; gap: 10px; padding: 14px 16px 16px; overflow: hidden; border-radius: 20px; transform: {{tilt}}; background: {{glass}}; -webkit-backdrop-filter: blur(18px) saturate(130%); backdrop-filter: blur(18px) saturate(130%); border: 1px solid rgba(255,255,255,0.12); box-shadow: {{slab}}">
<span aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 0; bottom: 0; background: {{shine}}"></span>
<h2 style="position: relative; margin: 0; font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.74)">Repeats</h2>
<div role="group" aria-label="Repeats" style="position: relative; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 3px; border-radius: 14px; background: rgba(0,0,0,0.30); box-shadow: inset 0 1px 3px rgba(0,0,0,0.60), inset 0 -1px 0 rgba(255,255,255,0.08)">
<sc-for list="{{periodSeg}}" as="o" hint-placeholder-count="3">
<button type="button" onClick="{{o.pick}}" aria-pressed="{{o.on}}" style="height: 38px; border: 0; border-radius: 11px; font: inherit; font-size: 13px; font-weight: 600; background: {{o.bg}}; color: {{o.fg}}; box-shadow: {{o.sh}}">{{o.label}}</button>
</sc-for>
</div>
</section>

<section style="position: relative; display: flex; flex-direction: column; gap: 10px; padding: 14px 16px 16px; overflow: hidden; border-radius: 20px; transform: {{tilt}}; background: {{glass}}; -webkit-backdrop-filter: blur(18px) saturate(130%); backdrop-filter: blur(18px) saturate(130%); border: 1px solid rgba(255,255,255,0.12); box-shadow: {{slab}}">
<span aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 0; bottom: 0; background: {{shine}}"></span>
<h2 style="position: relative; margin: 0; font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.74)">Goal</h2>
<div role="group" aria-label="Goal" style="position: relative; display: grid; grid-template-columns: {{goalCols}}; padding: 3px; border-radius: 14px; background: rgba(0,0,0,0.30); box-shadow: inset 0 1px 3px rgba(0,0,0,0.60), inset 0 -1px 0 rgba(255,255,255,0.08)">
<sc-for list="{{goalSeg}}" as="o" hint-placeholder-count="3">
<button type="button" onClick="{{o.pick}}" aria-pressed="{{o.on}}" style="height: 38px; border: 0; border-radius: 11px; font: inherit; font-size: 13px; font-weight: 600; background: {{o.bg}}; color: {{o.fg}}; box-shadow: {{o.sh}}">{{o.label}}</button>
</sc-for>
</div>
<sc-if value="{{showCount}}" hint-placeholder-val="{{true}}">
<div style="position: relative; display: flex; align-items: center; justify-content: space-between; height: 48px">
<span style="font-size: 15px; font-weight: 500">{{countLabel}}</span>
<div style="display: flex; align-items: center; gap: 6px">
<button type="button" onClick="{{countDown}}" aria-label="Fewer" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 22px; border: 1px solid rgba(255,255,255,0.14); background: {{lit}}; box-shadow: inset 0 1px 0 rgba(255,255,255,0.45), 0 2px 4px rgba(0,0,0,0.50); color: #FFFFFF"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 12h12"/></svg></button>
<span style="min-width: 40px; text-align: center; font-size: 22px; font-weight: 600; letter-spacing: -0.02em">{{count}}</span>
<button type="button" onClick="{{countUp}}" aria-label="More" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 22px; border: 1px solid rgba(255,255,255,0.14); background: {{lit}}; box-shadow: inset 0 1px 0 rgba(255,255,255,0.45), 0 2px 4px rgba(0,0,0,0.50); color: #FFFFFF"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 12h12M12 6v12"/></svg></button>
</div>
</div>
</sc-if>
</section>

<sc-if value="{{showSlots}}" hint-placeholder-val="{{true}}">
<section style="position: relative; display: flex; flex-direction: column; gap: 10px; padding: 14px 16px 16px; overflow: hidden; border-radius: 20px; transform: {{tilt}}; background: {{glass}}; -webkit-backdrop-filter: blur(18px) saturate(130%); backdrop-filter: blur(18px) saturate(130%); border: 1px solid rgba(255,255,255,0.12); box-shadow: {{slab}}">
<span aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 0; bottom: 0; background: {{shine}}"></span>
<h2 style="position: relative; margin: 0; font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.74)">{{slotTitle}}</h2>
<div style="position: relative; display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{slots}}" as="sl" hint-placeholder-count="3">
<button type="button" style="height: 44px; padding: 0 14px; border-radius: 22px; border: 1px solid rgba(255,255,255,0.14); background: {{lit}}; box-shadow: inset 0 1px 0 rgba(255,255,255,0.45), 0 2px 4px rgba(0,0,0,0.50); color: #FFFFFF; font: inherit; font-size: 14px; font-weight: 600">{{sl.label}}</button>
</sc-for>
</div>
<p style="position: relative; margin: 0; font-size: 12px; line-height: 16px; color: rgba(255,255,255,0.74)">A suggestion, not a requirement. It sets the order on Track.</p>
<div style="position: relative; display: flex; align-items: center; justify-content: space-between; height: 44px">
<span id="remind-label" style="font-size: 15px; font-weight: 500">Remind me</span>
<button type="button" role="switch" aria-checked="{{remindOn}}" aria-labelledby="remind-label" onClick="{{toggleRemind}}" style="position: relative; width: 58px; height: 34px; padding: 0; border-radius: 17px; border: 1px solid rgba(255,255,255,0.14); background: {{remindBg}}; box-shadow: inset 0 1px 3px rgba(0,0,0,0.60), inset 0 -1px 0 rgba(255,255,255,0.08)"><span aria-hidden="true" style="position: absolute; left: 3px; top: 3px; width: 26px; height: 26px; border-radius: 13px; transform: translateX({{remindX}}); background: linear-gradient(160deg, #FFFFFF 0%, #C9D2E0 100%); box-shadow: inset 0 1px 0 rgba(255,255,255,0.90), 0 2px 4px rgba(0,0,0,0.60)"></span></button>
</div>
</section>
</sc-if>

<sc-if value="{{isAvoid}}" hint-placeholder-val="{{false}}">
<section style="position: relative; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; overflow: hidden; border-radius: 20px; transform: {{tilt}}; background: {{glass}}; -webkit-backdrop-filter: blur(18px) saturate(130%); backdrop-filter: blur(18px) saturate(130%); border: 1px solid rgba(255,255,255,0.12); box-shadow: {{slab}}">
<span aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 0; bottom: 0; background: {{shine}}"></span>
<span id="pin-label" style="position: relative; font-size: 15px; font-weight: 500">Move to the top once logged</span>
<button type="button" role="switch" aria-checked="{{pinOn}}" aria-labelledby="pin-label" onClick="{{togglePin}}" style="position: relative; flex-shrink: 0; width: 58px; height: 34px; padding: 0; border-radius: 17px; border: 1px solid rgba(255,255,255,0.14); background: {{pinBg}}; box-shadow: inset 0 1px 3px rgba(0,0,0,0.60), inset 0 -1px 0 rgba(255,255,255,0.08)"><span aria-hidden="true" style="position: absolute; left: 3px; top: 3px; width: 26px; height: 26px; border-radius: 13px; transform: translateX({{pinX}}); background: linear-gradient(160deg, #FFFFFF 0%, #C9D2E0 100%); box-shadow: inset 0 1px 0 rgba(255,255,255,0.90), 0 2px 4px rgba(0,0,0,0.60)"></span></button>
</section>
</sc-if>

<section style="position: relative; display: flex; flex-direction: column; gap: 6px; padding: 14px 16px 12px; overflow: hidden; border-radius: 20px; transform: {{tilt}}; background: {{glass}}; -webkit-backdrop-filter: blur(18px) saturate(130%); backdrop-filter: blur(18px) saturate(130%); border: 1px solid rgba(255,255,255,0.12); box-shadow: {{slab}}">
<span aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 0; bottom: 0; background: {{shine}}"></span>
<h2 style="position: relative; margin: 0; font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.74)">Scoring</h2>
<div style="position: relative; display: flex; align-items: center; justify-content: space-between; height: 48px">
<span style="font-size: 15px; font-weight: 500">Streak allows a gap of</span>
<div style="display: flex; align-items: center; gap: 6px">
<button type="button" onClick="{{gapDown}}" aria-label="Shorter gap" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 22px; border: 1px solid rgba(255,255,255,0.14); background: {{lit}}; box-shadow: inset 0 1px 0 rgba(255,255,255,0.45), 0 2px 4px rgba(0,0,0,0.50); color: #FFFFFF"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 12h12"/></svg></button>
<span style="min-width: 58px; text-align: center; font-size: 17px; font-weight: 600">{{gapText}}</span>
<button type="button" onClick="{{gapUp}}" aria-label="Longer gap" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 22px; border: 1px solid rgba(255,255,255,0.14); background: {{lit}}; box-shadow: inset 0 1px 0 rgba(255,255,255,0.45), 0 2px 4px rgba(0,0,0,0.50); color: #FFFFFF"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 12h12M12 6v12"/></svg></button>
</div>
</div>
<div style="position: relative; display: flex; align-items: center; justify-content: space-between; height: 48px">
<span style="font-size: 15px; font-weight: 500">Average is full at</span>
<div style="display: flex; align-items: center; gap: 6px">
<button type="button" onClick="{{fullDown}}" aria-label="Lower" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 22px; border: 1px solid rgba(255,255,255,0.14); background: {{lit}}; box-shadow: inset 0 1px 0 rgba(255,255,255,0.45), 0 2px 4px rgba(0,0,0,0.50); color: #FFFFFF"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 12h12"/></svg></button>
<span style="min-width: 58px; text-align: center; font-size: 17px; font-weight: 600">{{fullText}}</span>
<button type="button" onClick="{{fullUp}}" aria-label="Higher" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 22px; border: 1px solid rgba(255,255,255,0.14); background: {{lit}}; box-shadow: inset 0 1px 0 rgba(255,255,255,0.45), 0 2px 4px rgba(0,0,0,0.50); color: #FFFFFF"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 12h12M12 6v12"/></svg></button>
</div>
</div>
</section>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<button type="button" style="position: relative; height: 50px; overflow: hidden; border-radius: 18px; transform: {{tilt}}; background: {{glass}}; -webkit-backdrop-filter: blur(18px) saturate(130%); backdrop-filter: blur(18px) saturate(130%); border: 1px solid rgba(255,255,255,0.12); box-shadow: {{slab}}; color: #FFFFFF; font: inherit; font-size: 15px; font-weight: 600">Archive</button>
<button type="button" style="position: relative; height: 50px; overflow: hidden; border-radius: 18px; transform: {{tilt}}; background: {{glass}}; -webkit-backdrop-filter: blur(18px) saturate(130%); backdrop-filter: blur(18px) saturate(130%); border: 1px solid rgba(240,128,108,0.55); box-shadow: {{slab}}; color: #FFB3A3; font: inherit; font-size: 15px; font-weight: 600">Delete</button>
</div>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"effects":{"editor":"boolean","default":true},"glassTint":{"editor":"color","default":"#DCE6F5","options":["#DCE6F5","#FFFFFF","#BFE6DA","#F2D3AE"]},"$preview":{"width":390,"height":1190}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { name: 'Medication', type: 'do', period: 'daily', goal: 'exactly', count: 3, remind: true, pin: true, gap: 0, full: 85 };
}
renderVals() {
var self = this;
var fx = this.props.effects ?? true;
var st = this.state || {};
var tx = st.tx == null ? -0.35 : st.tx;
var ty = st.ty == null ? -0.4 : st.ty;
if (!fx) { tx = 0; ty = 0; }
var hex = String(this.props.glassTint ?? '#DCE6F5').replace('#', '');
if (hex.length === 3) { hex = hex[0] + hex[0] + hex[1] + hex[1] + hex[2] + hex[2]; }
var n = parseInt(hex, 16);
if (isNaN(n)) { n = 0xDCE6F5; }
var t = ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255);
var glass = 'linear-gradient(160deg, rgba(' + t + ',0.11) 0%, rgba(' + t + ',0.03) 100%)';
var lit = 'linear-gradient(180deg, rgba(' + t + ',0.30) 0%, rgba(' + t + ',0.14) 100%)';
var slab = fx
? 'inset 1px 1px 0 rgba(255,255,255,0.42), inset -1px -1px 0 rgba(0,0,0,0.40), inset 0 0 22px rgba(255,255,255,0.05), 0 1px 0 rgba(196,210,232,0.34), 0 2px 0 rgba(156,170,194,0.28), 0 3px 0 rgba(116,130,154,0.24), 0 4px 0 rgba(76,88,108,0.24), 0 5px 0 rgba(30,36,48,0.40), ' + (-tx * 4).toFixed(1) + 'px ' + (18 - ty * 3).toFixed(1) + 'px 26px -6px rgba(0,0,0,0.88)'
: 'inset 0 1px 0 rgba(255,255,255,0.18), 0 10px 18px -12px rgba(0,0,0,0.75)';
var tilt = fx ? 'rotateX(' + (-ty * 0.9).toFixed(2) + 'deg) rotateY(' + (tx * 1.3).toFixed(2) + 'deg)' : 'none';
var shine = fx
? 'radial-gradient(130px 84px at ' + (12 + tx * 10).toFixed(1) + '% ' + (2 + ty * 8).toFixed(1) + '%, rgba(255,255,255,0.26) 0%, rgba(255,255,255,0) 72%), linear-gradient(125deg, rgba(255,255,255,0.10) 0%, rgba(255,255,255,0) 30%)'
: 'linear-gradient(180deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0) 50%)';
var raised = 'inset 0 1px 0 rgba(255,255,255,0.45), 0 2px 4px rgba(0,0,0,0.50)';
function seg(options, current, onPick) {
return options.map(function (o) {
var on = o[0] === current;
return {
label: o[1], on: on ? 'true' : 'false',
bg: on ? lit : 'transparent', fg: on ? '#FFFFFF' : 'rgba(255,255,255,0.74)', sh: on ? raised : 'none',
pick: function () { onPick(o[0]); }
};
});
}
var avoid = st.type === 'avoid';
var unit = { daily: 'day', weekly: 'week', monthly: 'month' }[st.period] || 'day';
var goalOptions = avoid ? [['atmost', 'At most'], ['none', 'No limit']] : [['exactly', 'Exactly'], ['atleast', 'At least'], ['none', 'No limit']];
var showCount = st.goal !== 'none';
var slotSets = {
daily: ['8:00 AM', '2:00 PM', '8:00 PM', '11:00 AM'],
weekly: ['Monday', 'Wednesday', 'Friday', 'Saturday'],
monthly: ['Day 1', 'Day 10', 'Day 20', 'Day 28']
};
var slotCount = Math.max(1, Math.min(4, st.count));
var slots = (slotSets[st.period] || slotSets.daily).slice(0, slotCount).map(function (label) { return { label: label }; });
var gapUnit = unit + (st.gap === 1 ? '' : 's');
function sw(on) { return on ? 'rgba(' + t + ',0.40)' : 'rgba(0,0,0,0.30)'; }
return {
glass: glass, lit: lit, slab: slab, tilt: tilt, shine: shine,
name: st.name,
setName: function (e) { self.setState({ name: e.target.value }); },
typeSeg: seg([['do', 'Do'], ['avoid', 'Avoid']], st.type, function (v) {
self.setState(v === 'avoid' ? { type: v, goal: 'atmost', count: 0 } : { type: v, goal: 'exactly', count: 3 });
}),
typeHelp: avoid ? 'Starts each ' + unit + ' clear. Hold the card to log each time it happens.' : 'Hold the card to mark it done, or to add one.',
periodSeg: seg([['daily', 'Daily'], ['weekly', 'Weekly'], ['monthly', 'Monthly']], st.period, function (v) { self.setState({ period: v }); }),
goalSeg: seg(goalOptions, st.goal, function (v) { self.setState({ goal: v }); }),
goalCols: 'repeat(' + goalOptions.length + ', minmax(0, 1fr))',
showCount: showCount,
countLabel: (avoid ? 'Allowed per ' : 'Times per ') + unit,
count: String(st.count),
countDown: function () { self.setState({ count: Math.max(avoid ? 0 : 1, st.count - 1) }); },
countUp: function () { self.setState({ count: Math.min(99, st.count + 1) }); },
showSlots: !avoid && showCount && st.count <= 4,
isAvoid: avoid,
slotTitle: st.period === 'daily' ? 'Preferred times' : 'Preferred days',
slots: slots,
remindOn: st.remind ? 'true' : 'false', remindBg: sw(st.remind), remindX: st.remind ? '24px' : '0px',
toggleRemind: function () { self.setState({ remind: !st.remind }); },
pinOn: st.pin ? 'true' : 'false', pinBg: sw(st.pin), pinX: st.pin ? '24px' : '0px',
togglePin: function () { self.setState({ pin: !st.pin }); },
gapText: st.gap === 0 ? 'None' : st.gap + ' ' + gapUnit,
gapDown: function () { self.setState({ gap: Math.max(0, st.gap - 1) }); },
gapUp: function () { self.setState({ gap: Math.min(30, st.gap + 1) }); },
fullText: st.full + '%',
fullDown: function () { self.setState({ full: Math.max(50, st.full - 5) }); },
fullUp: function () { self.setState({ full: Math.min(100, st.full + 5) }); },
move: function (e) {
var now = Date.now();
if (self._last && now - self._last < 40) { return; }
self._last = now;
var r = e.currentTarget.getBoundingClientRect();
self.setState({ tx: ((e.clientX - r.left) / r.width) * 2 - 1, ty: ((e.clientY - r.top) / r.height) * 2 - 1 });
}
};
}
}
</script>
